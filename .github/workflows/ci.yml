name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: "latest"

      - name: Install dependencies
        run: pixi install --verbose
        timeout-minutes: 30

      - name: Run lints
        run: pixi run lint

  test:
    name: Test
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: "latest"

      - name: Install dependencies
        run: pixi install --verbose
        timeout-minutes: 30

      - name: Run tests
        run: pixi run test

      - name: Run benchmarks
        run: pixi run bench
        continue-on-error: true
