[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milkha"
version = "0.1.0"
description = "A FastAPI-compatible web framework for Mojo, built on Flare."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Niranjan Anandkumar", email = "nirunitk@gmail.com" },
]
keywords = ["mojo", "fastapi", "web-framework", "flare", "http"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "twine>=4.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/elixcode-space/milkha"
Issues = "https://github.com/elixcode-space/milkha/issues"
Source = "https://github.com/elixcode-space/milkha"

[tool.hatch.build.targets.wheel]
packages = ["milkha"]

[tool.hatch.build.targets.sdist]
include = [
    "milkha/",
    "tests/",
    "pixi.toml",
    "README.md",
    "LICENSE",
]
